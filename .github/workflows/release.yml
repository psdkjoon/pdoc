name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  FLUTTER_VERSION: "3.47.3"
  BUILD_TOOLS_VERSION: "37.0.0"
  NDK_VERSION: "28.2.13676358"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; else echo "no test/ directory, skipping"; fi

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android build-tools & NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - run: flutter pub get

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Strip, zipalign & sign
        run: ./scripts/strip.sh
        env:
          APK_OUTPUT_DIR: build/app/outputs/flutter-apk
          BUILD_TOOLS_DIR: ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          STRIP_TOOL: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-apks
          path: build/app/outputs/flutter-apk/*-stripped-signed.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/symbols
          retention-days: 90
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Build AppImage
        run: ./scripts/appimage.sh
        env:
          BUNDLE_DIR: build/linux/x64/release/bundle
          OUTPUT_DIR: ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

  deploy-s3:
    needs: [web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-s3
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Write s3cmd config
        env:
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
        run: |
          umask 077
          cat > "$HOME/.s3cfg" <<EOF
          [default]
          access_key = $ARVAN_ACCESS_KEY
          secret_key = $ARVAN_SECRET_KEY
          host_base = https://s3.ir-thr-at1.arvanstorage.ir
          host_bucket = https://s3.ir-thr-at1.arvanstorage.ir
          use_https = True
          EOF

      - name: Sync to bucket
        run: |
          s3cmd sync \
            --acl-public \
            --delete-removed \
            --guess-mime-type \
            --no-mime-magic \
            --add-header="Cache-Control: no-cache" \
            web-build/ "s3://psdk-doc/"

  release:
    needs: [android, linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Move 'latest' tag to this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/android-signed-apks/*.apk
            artifacts/linux-appimage/*.AppImage
