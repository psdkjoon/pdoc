  <style>
    :root {
      --bg: #14110C; --fg: #E9DFC8; --muted: #A8987A; --accent: #D4A857;
      --border: #332918;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FAF6EC; --fg: #2B2417; --muted: #6B5D45; --accent: #9C6B2E;
        --border: #E2D5B8;
      }
    }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1.25rem; padding: 1.5rem;
      box-sizing: border-box; text-align: center; background: var(--bg);
      transition: opacity .3s ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 72px; height: 72px; border-radius: 16px; }
    #splash h1 {
      margin: 0; font-size: clamp(1.5rem, 6vw, 2.5rem); line-height: 1.2;
      overflow-wrap: anywhere;
    }
    #splash p {
      margin: 0; max-width: 32rem; color: var(--muted);
      font-size: clamp(.875rem, 3.5vw, 1rem); line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .bar {
      width: min(14rem, 60vw); height: 3px; border-radius: 3px;
      background: var(--border); overflow: hidden;
    }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--accent); border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      .bar::after { animation: none; width: 100%; }
      #splash { transition: none; }
    }
    .sr {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Loading psdkjoon Docs">
    <img src="assets/images/icon-192.webp" width="72" height="72" alt="" decoding="async" fetchpriority="high">
    <h1>psdkjoon Docs</h1>
    <p>Searchable documentation for apps and programming projects.</p>
    <div class="bar" aria-hidden="true"></div>
  </div>

  <main class="sr">
    <h1>psdkjoon Docs</h1>
    <p>Searchable, versioned documentation for psdkjoon's apps and programming projects, with guides, references and code examples.</p>
    <nav aria-label="Project links">
      <a href="https://github.com/psdkjoon">Source code and projects on GitHub</a>
    </nav>
  </main>
  <noscript>
    <div style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center;background:var(--bg);color:var(--fg)">
      <p>psdkjoon Docs needs JavaScript to run. Please enable it and reload.</p>
    </div>
  </noscript>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var removed = false;
      function hide() {
        if (removed || !splash) return;
        removed = true;
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
