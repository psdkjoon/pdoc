<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found — psdkjoon Docs</title>
  <meta name="description" content="This page doesn't exist. Head back to psdkjoon Docs to browse the documentation.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#14110C" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF6EC" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/webp" href="/assets/images/icon-192.webp">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/webp" sizes="192x192" href="/assets/images/icon-192.webp">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Page not found — psdkjoon Docs">
  <meta property="og:image" content="https://doc.psdkjoon.ir/assets/images/social-preview.webp">

  <style>
    :root {
      --bg: #14110C; --fg: #E9DFC8; --muted: #A8987A; --accent: #D4A857;
      --on-accent: #100D09; --border: #332918;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FAF6EC; --fg: #2B2417; --muted: #6B5D45; --accent: #9C6B2E;
        --on-accent: #FFFFFF; --border: #E2D5B8;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem;
    }
    main {
      display: flex; flex-direction: column; align-items: center;
      gap: 1.25rem; text-align: center; max-width: 36rem; width: 100%;
    }
    img {
      width: min(100%, 26rem); height: auto; border-radius: 1rem;
      border: 2px solid var(--border);
    }
    h1 {
      margin: 0; font-size: clamp(1.75rem, 7vw, 2.75rem); line-height: 1.2;
      overflow-wrap: anywhere;
    }
    p {
      margin: 0; color: var(--muted); line-height: 1.6;
      font-size: clamp(.9375rem, 3.5vw, 1.0625rem); overflow-wrap: anywhere;
    }
    a.button {
      display: inline-block; padding: .75rem 1.5rem; border-radius: .625rem;
      background: var(--accent); color: var(--on-accent); font-weight: 700;
      text-decoration: none; min-height: 3rem; line-height: 1.5;
    }
    a.button:hover, a.button:focus-visible { filter: brightness(1.1); }
    a.button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/404.webp"
         alt="404 — page not found" decoding="async">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="button" href="/">Back to psdkjoon Docs</a>
  </main>
</body>
</html>
